# Local n8n for Stylo order desk demos.
# 1. Copy .env.example → .env and fill DESK_SECRET / GINKGO_* / SHEET_ID
# 2. docker compose up -d
# 3. Open http://127.0.0.1:5678
# 4. After tunnel: set N8N_WEBHOOK_URL then docker compose up -d again

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: stylo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-${WEBHOOK_URL:-http://localhost:5678/}}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-${WEBHOOK_URL:-http://localhost:5678/}}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Karachi}
      - TZ=${GENERIC_TIMEZONE:-Asia/Karachi}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      - DESK_SECRET=${DESK_SECRET:-}
      - GINKGO_BASE_URL=${GINKGO_BASE_URL:-}
      - GINKGO_AUTH=${GINKGO_AUTH:-}
      - SHEET_ID=${SHEET_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
