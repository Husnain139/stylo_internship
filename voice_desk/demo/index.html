<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stylo order desk</title>
  <style>
    :root {
      --stylo: #e4007f;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: #ececec;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(228, 0, 127, 0.08), transparent 55%),
        #fafafa;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    .brand {
      display: block;
      width: min(240px, 72vw);
      height: auto;
      margin: 0 auto 18px;
    }

    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .hint span {
      color: var(--stylo);
      font-weight: 600;
    }

    #order-panel {
      position: fixed;
      right: 20px;
      bottom: 108px;
      z-index: 40;
      width: min(380px, calc(100vw - 32px));
      max-height: min(60vh, 520px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      padding: 14px 16px 16px;
    }

    #order-panel[hidden] {
      display: none !important;
    }

    #order-panel .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 1;
      padding-bottom: 4px;
    }

    #order-panel .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--stylo);
      letter-spacing: 0.02em;
    }

    #order-panel .panel-close {
      border: 0;
      background: #f3f4f6;
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 999px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    #order-panel .panel-close:hover {
      background: #e5e7eb;
    }

    #order-blocks {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .order-block {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fcfcfc;
    }

    .order-block .meta {
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--ink);
    }

    .order-block .meta li {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--line);
    }

    .order-block .meta span:first-child {
      color: var(--muted);
      flex-shrink: 0;
    }

    .order-block .meta span:last-child {
      text-align: right;
      font-weight: 600;
      word-break: break-word;
    }

    .order-block table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .order-block th,
    .order-block td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }

    .order-block th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .order-block .empty {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      #order-panel {
        right: 12px;
        left: 12px;
        width: auto;
        bottom: 100px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="logo.png" alt="Stylo" width="240" height="90">
    <h1>Stylo</h1>
    <p>Order desk. Say your 7-digit order number.</p>
    <p class="hint">Tap <span>Start call</span> in the corner. Lookups append here; use × to close.</p>
  </main>

  <aside id="order-panel" hidden aria-live="polite">
    <div class="panel-header">
      <p class="panel-title">Order details</p>
      <button type="button" class="panel-close" id="order-close" aria-label="Close order details">×</button>
    </div>
    <div id="order-blocks"></div>
  </aside>

  <elevenlabs-convai agent-id="agent_6201m60xdtanewtr7q9r8eda9ebk"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  <script>
    (function () {
      var panel = document.getElementById("order-panel");
      var blocks = document.getElementById("order-blocks");
      var closeBtn = document.getElementById("order-close");

      function clearOrderDetails() {
        panel.hidden = true;
        blocks.innerHTML = "";
        return "cleared";
      }

      function parseUi(raw) {
        if (!raw) return null;
        if (typeof raw === "object") return raw;
        try {
          return JSON.parse(String(raw));
        } catch (error) {
          return null;
        }
      }

      function normalizeOrders(ui) {
        if (!ui) return [];
        if (Array.isArray(ui.orders) && ui.orders.length) return ui.orders;
        if (ui.order_number || (ui.products && ui.products.length)) return [ui];
        return [];
      }

      function addMeta(list, label, value) {
        if (!value && value !== 0) return;
        var li = document.createElement("li");
        var left = document.createElement("span");
        var right = document.createElement("span");
        left.textContent = label;
        right.textContent = value;
        li.appendChild(left);
        li.appendChild(right);
        list.appendChild(li);
      }

      function appendOrderBlock(orderUi) {
        var block = document.createElement("section");
        block.className = "order-block";

        var meta = document.createElement("ul");
        meta.className = "meta";
        var total = orderUi.total_price
          ? String(orderUi.total_price) + (/\s*rupees$/i.test(String(orderUi.total_price)) ? "" : " rupees")
          : "";
        addMeta(meta, "Order", orderUi.order_number);
        addMeta(meta, "Shop", orderUi.shop_name);
        addMeta(meta, "Status", orderUi.status);
        addMeta(meta, "Total", total);
        addMeta(meta, "Placed", orderUi.created_at);
        addMeta(meta, "Courier", orderUi.courier_name);
        addMeta(meta, "Tracking", orderUi.tracking_number);
        block.appendChild(meta);

        var table = document.createElement("table");
        table.innerHTML = "<thead><tr><th scope=\"col\">Item</th><th scope=\"col\">SKU</th><th scope=\"col\">Qty</th></tr></thead>";
        var tbody = document.createElement("tbody");
        var products = Array.isArray(orderUi.products) ? orderUi.products : [];
        if (products.length === 0) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No line items on this order.";
          block.appendChild(empty);
        } else {
          products.forEach(function (item) {
            var tr = document.createElement("tr");
            var name = document.createElement("td");
            var sku = document.createElement("td");
            var qty = document.createElement("td");
            name.textContent = item.name || "—";
            sku.textContent = item.sku || "—";
            qty.textContent = item.qty || "—";
            tr.appendChild(name);
            tr.appendChild(sku);
            tr.appendChild(qty);
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
          block.appendChild(table);
        }

        blocks.appendChild(block);
      }

      function showOrderDetails(args) {
        var ui = parseUi(args && (args.ui_json || args.ui || args));
        if (!ui) return "missing ui_json";
        var orders = normalizeOrders(ui);
        if (!orders.length) return "no orders";

        orders.forEach(appendOrderBlock);
        panel.hidden = false;
        panel.scrollTop = panel.scrollHeight;
        return "appended " + orders.length;
      }

      closeBtn.addEventListener("click", clearOrderDetails);

      function attachClientTools() {
        var widget = document.querySelector("elevenlabs-convai");
        if (!widget || widget.dataset.toolsBound === "1") return;
        widget.dataset.toolsBound = "1";
        widget.addEventListener("elevenlabs-convai:call", function (event) {
          event.detail.config.clientTools = {
            show_order_details: showOrderDetails,
            clear_order_details: clearOrderDetails
          };
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", attachClientTools);
      } else {
        attachClientTools();
      }
      setTimeout(attachClientTools, 500);
    })();
  </script>
</body>
</html>
