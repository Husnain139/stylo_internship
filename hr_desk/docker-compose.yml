services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr_desk
      POSTGRES_PASSWORD: hr_desk
      POSTGRES_DB: hr_desk
    ports:
      # This computer only. Other machines on the company network cannot open the database.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_desk -d hr_desk"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hr_desk_pg:/var/lib/postgresql/data

volumes:
  hr_desk_pg:
