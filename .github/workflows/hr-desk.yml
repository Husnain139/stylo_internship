name: HR Desk checks
on:
  push:
    paths:
      - 'hr_desk/**'
      - '.github/workflows/hr-desk.yml'
  pull_request:
    paths:
      - 'hr_desk/**'
      - '.github/workflows/hr-desk.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr_desk_test
          POSTGRES_PASSWORD: hr_desk_test
          POSTGRES_DB: hr_desk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hr_desk_test -d hr_desk_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      HR_DESK_TEST_DATABASE_URL: postgresql://hr_desk_test:hr_desk_test@127.0.0.1:5432/hr_desk_test
    defaults:
      run:
        working-directory: hr_desk/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr_desk/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
